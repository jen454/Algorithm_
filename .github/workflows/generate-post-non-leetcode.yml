name: Generate Post (백준/프로그래머스)

on:
  workflow_dispatch:  # 수동 실행 옵션
  push:
    paths:
      - '백준/**'
      - '프로그래머스/**'

# 여러 커밋이 연달아 push될 때 동시에 돌면서 posts/ push가 충돌하는 걸 방지.
concurrency:
  group: generate-post-non-leetcode
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 최근 7일 커밋에서 누락된 초안을 찾고, push 전 rebase하기 위해 전체 히스토리 필요

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Verify Claude auth (smoke test)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          claude --version
          # 시크릿 값이 비어 있거나 공백/개행이 섞이면 인증이 실패한다.
          echo "token length (raw): ${#CLAUDE_CODE_OAUTH_TOKEN}"
          # 붙여넣기 과정에서 값 중간에 개행이 들어가는 경우가 있어 공백 문자를 제거한다.
          CLAUDE_CODE_OAUTH_TOKEN="$(printf '%s' "$CLAUDE_CODE_OAUTH_TOKEN" | tr -d '[:space:]')"
          export CLAUDE_CODE_OAUTH_TOKEN
          echo "token length (cleaned): ${#CLAUDE_CODE_OAUTH_TOKEN}"
          # 실제 호출이 되는지 최소 프롬프트로 확인. 실패해도 본 작업은 계속 진행하고,
          # 에러 본문(stdout)을 로그에 남겨 원인을 알 수 있게 한다.
          claude -p "ok" --model claude-sonnet-5 --output-format json || \
            echo "::warning::claude 인증 스모크 테스트 실패 (위 출력 확인)"

      - name: Detect changed problem directories
        id: detect
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          # core.quotePath=false: 한글 경로가 "\355\225\234..." 로 이스케이프되는 걸 막는다.
          GIT_DIFF='git -c core.quotePath=false diff --name-only'

          use_fallback=0
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            # 최초 push이거나 workflow_dispatch로 수동 실행한 경우 before가 비어 있다.
            echo "before 값이 비어 있음 -> HEAD~1 fallback"
            use_fallback=1
          elif ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            # force-push 등으로 before 커밋이 사라졌거나 shallow clone에 없는 경우.
            echo "before 커밋($BEFORE)을 찾을 수 없음 -> HEAD~1 fallback"
            use_fallback=1
          fi

          if [ "$use_fallback" -eq 0 ]; then
            if ! $GIT_DIFF "$BEFORE" "$SHA" > /tmp/changed.txt 2>/dev/null; then
              echo "diff 실패 -> HEAD~1 fallback"
              use_fallback=1
            fi
          fi

          if [ "$use_fallback" -eq 1 ]; then
            if ! $GIT_DIFF HEAD~1 HEAD > /tmp/changed.txt 2>/dev/null; then
              # 커밋이 하나뿐이라 HEAD~1이 없는 경우: HEAD 커밋의 파일 목록을 그대로 사용.
              echo "HEAD~1도 없음 -> HEAD 커밋의 파일 목록 사용"
              git -c core.quotePath=false show --name-only --pretty=format: HEAD > /tmp/changed.txt
            fi
          fi

          echo "--- 변경된 파일 ---"
          cat /tmp/changed.txt

          # 백준/프로그래머스는 "<플랫폼>/<티어 또는 레벨>/<문제 폴더>" 2단계 구조다.
          # (예: 백준/Bronze/2753. 윤년, 프로그래머스/0/181858. 무작위로 K개의 수 뽑기)
          # 따라서 앞 3개 경로 조각을 문제 폴더로 잡고 중복을 제거한다.
          grep -E '^(백준|프로그래머스)/' /tmp/changed.txt \
            | awk -F/ 'NF >= 3 { print $1 "/" $2 "/" $3 }' \
            | sort -u > /tmp/dirs.txt || true

          # concurrency 그룹은 대기 실행을 1개만 유지하고, 새 실행이 오면 이전 대기 실행을 취소한다.
          # 취소된 push의 diff는 다시 보지 않으므로, 최근 7일 안에 바뀐 문제 폴더 중
          # 초안이 아직 없는 것도 대상에 넣어 다음 실행에서 메운다.
          # (7일로 제한해 파이프라인 이전에 푼 옛 문제까지 한꺼번에 생성되지 않게 한다.)
          git -c core.quotePath=false log --since="7 days ago" --name-only --pretty=format: -- 백준 프로그래머스 \
            | grep -E '^(백준|프로그래머스)/' \
            | awk -F/ 'NF >= 3 { print $1 "/" $2 "/" $3 }' \
            | sort -u > /tmp/recent.txt || true

          while IFS= read -r dir; do
            [ -n "$dir" ] && [ -d "$dir" ] || continue
            out="$(python scripts/generate_post.py "$dir" --print-output-path 2>/dev/null)" || continue
            if [ ! -f "$out" ]; then
              echo "초안 누락 -> 대상에 추가: $dir"
              echo "$dir" >> /tmp/dirs.txt
            fi
          done < /tmp/recent.txt
          sort -u -o /tmp/dirs.txt /tmp/dirs.txt

          echo "--- 대상 문제 폴더 ---"
          cat /tmp/dirs.txt

      - name: Generate blog post drafts
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ ! -s /tmp/dirs.txt ]; then
            echo "대상 폴더 없음"
            exit 0
          fi

          # 폴더명에 공백이 있으므로(예: "2753. 윤년") 줄 단위로 읽는다.
          while IFS= read -r dir; do
            [ -n "$dir" ] || continue
            if [ ! -d "$dir" ]; then
              # 문제 폴더가 삭제된 커밋이면 건너뛴다.
              echo "::warning::폴더를 찾을 수 없어 건너뜀: $dir"
              continue
            fi

            # 연동 확장이 README와 코드를 별도 커밋으로 올리는 경우가 있어,
            # 둘 다 모였을 때만 생성한다(중복 호출/반쪽짜리 포스트 방지).
            if [ ! -f "$dir/README.md" ]; then
              echo "::notice::README.md가 아직 없어 건너뜀(다음 커밋에서 처리됨): $dir"
              continue
            fi
            # ls는 인자 중 하나라도 없으면 실패를 반환하므로 find로 판정한다.
            if [ -z "$(find "$dir" -maxdepth 1 -type f \
                 \( -name '*.py' -o -name '*.java' -o -name '*.js' -o -name '*.ts' \
                    -o -name '*.cpp' -o -name '*.c' -o -name '*.go' \) -print -quit)" ]; then
              echo "::notice::solution 파일이 아직 없어 건너뜀(다음 커밋에서 처리됨): $dir"
              continue
            fi

            echo "=== generate_post.py \"$dir\" ==="
            # 한 폴더가 실패해도 나머지는 계속 만들고, 실패 목록은 마지막 스텝에서 job 실패로 드러낸다.
            if ! python scripts/generate_post.py "$dir"; then
              echo "::warning::포스트 생성 실패(계속 진행): $dir"
              echo "$dir" >> /tmp/failed.txt
            fi
          done < /tmp/dirs.txt

      - name: Commit and push generated posts
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          if [ -z "$(git status --porcelain posts/)" ]; then
            echo "생성된 포스트 변경사항 없음"
            exit 0
          fi

          git add posts/
          git commit -m "docs: auto-generate blog post draft"

          # 다른 워크플로우(LeetCode 이동 등)와 겹칠 수 있으므로 rebase 후 재시도.
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              echo "Push succeeded on attempt $attempt"
              exit 0
            fi
            git rebase --abort || true
            echo "Push failed on attempt $attempt, retrying..."
            sleep $((RANDOM % 5 + 1))
          done

          echo "Push failed after 3 attempts"
          exit 1

      # 생성 실패를 경고로만 남기면 토큰 만료 같은 문제가 있어도 CI가 초록불로 끝난다.
      # 성공한 초안은 위에서 이미 push했으므로, 여기서 실패를 job 결과에 반영한다.
      - name: Fail if any post generation failed
        run: |
          if [ -s /tmp/failed.txt ]; then
            echo "::error::포스트 생성에 실패한 폴더가 있습니다:"
            cat /tmp/failed.txt
            exit 1
          fi
          echo "생성 실패 없음"
